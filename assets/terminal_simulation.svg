<?xml version='1.0' encoding='utf-8'?>
<svg width="880" height="420" xmlns="http://www.w3.org/2000/svg" style="background-color: #0d1117; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
    <style>
        @keyframes reveal { from { width: 0px; } to { width: 660px; } }
        #clip-rect { animation: reveal 2.2s steps(48, end) forwards; animation-delay: 0.4s; }
        #cursor { animation: move-cursor 2.2s steps(48, end) forwards, blink-caret 0.75s step-end infinite; animation-delay: 0.4s; }
        @keyframes move-cursor { from { transform: translateX(0px); } to { transform: translateX(660px); } }
        @keyframes blink-caret { from, to { opacity: 0; } 50% { opacity: 1; } }
        .output { opacity: 0; animation: show-output 0.1s forwards; animation-delay: 2.8s; }
        @keyframes show-output { to { opacity: 1; } }
        .hide-cursor { animation: hide-it 0.1s forwards; animation-delay: 2.8s; }
        @keyframes hide-it { to { opacity: 0; } }
    </style>
    <rect x="15" y="15" width="850" height="390" fill="#0d1117" stroke="#30363d" stroke-width="1.5" rx="8" />
    <rect x="15" y="15" width="850" height="34" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="8" />
    <rect x="16" y="38" width="848" height="11" fill="#161b22" />
    <circle cx="36" cy="32" r="6" fill="#ff5f56" />
    <circle cx="56" cy="32" r="6" fill="#ffbd2e" />
    <circle cx="76" cy="32" r="6" fill="#27c93f" />
    <text x="440" y="36" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">devtyagi@macbook: ~/the-relay</text>
    
    <g transform="translate(35, 75)">
        <text x="0" y="0" fill="#3fb950" font-size="13" font-weight="bold">➜</text>
        <text x="18" y="0" fill="#79c0ff" font-size="13" font-weight="bold">~</text>
        <defs>
            <clipPath id="type-clip">
                <rect x="36" y="-14" width="0" height="20" id="clip-rect" />
            </clipPath>
        </defs>
        <text x="36" y="0" fill="#c9d1d9" font-size="13" font-weight="500" clip-path="url(#type-clip)">
            <tspan fill="#ff7b72">python3</tspan><tspan fill="#c9d1d9"> -m src.relay_pipeline --query "Compare Multi-Head Attention with Moshi RVQ" --stream</tspan>
        </text>
        <rect x="36" y="-12" width="7" height="15" fill="#58a6ff" id="cursor" class="hide-cursor" />
    </g>

    <g transform="translate(35, 110)" class="output">
        <text x="0" y="0" font-size="12" font-weight="500">
            <tspan fill="#8b949e">[1/4] Query Planner: </tspan>
            <tspan fill="#58a6ff">Lexical routing matched 2 papers (1706.03762v7, 2410.00037v1) in 1.1ms</tspan>
        </text>
        <text x="0" y="22" font-size="12" font-weight="500">
            <tspan fill="#8b949e">[2/4] Hybrid Retriever: </tspan>
            <tspan fill="#3fb950">Fetched top-5 passages (BM25 + TF-IDF char/word rerank in 8.4ms)</tspan>
        </text>
        <text x="0" y="44" font-size="12" font-weight="500">
            <tspan fill="#8b949e">[3/4] Streaming Synthesis: </tspan>
            <tspan fill="#c9d1d9">llama-3.1-8b-instant (TTFT: 241.2ms, decode: 260 tok/sec)</tspan>
        </text>
        <text x="0" y="66" font-size="12" font-weight="500">
            <tspan fill="#8b949e">[4/4] Bounded Verifier: </tspan>
            <tspan fill="#d29922">Verified 2 inline citations &amp; numbers against ground-truth chunks</tspan>
        </text>

        <text x="0" y="105" font-size="12" font-weight="600" fill="#f0883e">── Rate-Limit &amp; Admission Controller State ──</text>
        
        <text x="0" y="130" font-size="12" font-weight="500">
            <tspan fill="#3fb950">● Sliding Quota:</tspan>
            <tspan fill="#c9d1d9"> TPM: 4,550/6,000 remaining | RPM: 28/30 remaining | Queue: 0</tspan>
        </text>
        <text x="0" y="152" font-size="12" font-weight="500">
            <tspan fill="#79c0ff">● Stream Output:</tspan>
            <tspan fill="#c9d1d9"> "Vaswani [1706.03762v7, p.4] uses d_k=64 across h=8 heads; Moshi [2410.00037v1, p.3] quantizes into 12.5Hz RVQ"</tspan>
        </text>
        <text x="0" y="174" font-size="12" font-weight="500">
            <tspan fill="#d29922">● Fallback Policy:</tspan>
            <tspan fill="#c9d1d9"> Verified Extractive Citation Card active if 3 PM daily budget hits 0 (&lt;15ms latency)</tspan>
        </text>
        <text x="0" y="196" font-size="12" font-weight="500">
            <tspan fill="#8b949e">● Bounded Retry: </tspan>
            <tspan fill="#c9d1d9"> Backoff clamped to min(0.35, retry_after) + jitter (1 retry max to prevent retry storms)</tspan>
        </text>

        <text x="0" y="235" font-size="12" font-weight="600">
            <tspan fill="#3fb950">✔ Test Suite: </tspan>
            <tspan fill="#c9d1d9">python3 -m src.verify_submission passed 100% (450/450 tests verified, zero discrepancies)</tspan>
        </text>
    </g>
</svg>
